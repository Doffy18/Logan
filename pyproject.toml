[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logan-agent"
version = "0.1.0"
description = "Logan AI - Interactive Codebase Intelligence Agent"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "google-genai>=0.1.0",
    "ollama>=0.3.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.1.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-prebuilt>=0.1.0",
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0"
]

[project.scripts]
logan = "guard_and_cli_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]